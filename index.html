    <style>
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .styled-button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        .styled-button:hover {
            background-color: #45a049;
        }
    </style>
    <div class="button-container">
        <a href="/?user=doctor" class="styled-button">Doctor</a>
        <a href="/?user=patient" class="styled-button">Patient</a>
    </div>
